name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NotionTodoWidget

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Remove local SDK path (Windows path committed by mistake)
        run: rm -f local.properties

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Publish latest APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK (${{ github.sha }})
          body: main 브랜치 최신 코드로 자동 빌드된 APK입니다.
          files: NotionTodoWidget/app/build/outputs/apk/debug/NotionTodoWidget.apk
          make_latest: true
